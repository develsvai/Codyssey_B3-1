name: Deploy study to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/study/**'
      - '.github/workflows/deploy-study-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out study materials
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload study site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/study
      - name: Deploy study site
        id: deployment
        uses: actions/deploy-pages@v4
